    <script>

        let shop_Amt = Number(prompt("Enter Shopping Amount:"));

        let disc = 0;

        if (shop_Amt >= 50000) {
            disc = 40;
        }
        else if (shop_Amt >= 30000) {
            disc = 30;
        }
        else if (shop_Amt >= 20000) {
            disc = 20;
        }
        else {
            disc = 0;
        }

        let discount_Amt = (shop_Amt * disc);
        let final_Amt = shop_Amt - discount_Amt;

        console.log("Shopping Amount =", shop_Amt);
        console.log("Discount =", disc + "%");
        console.log("Discount Amount =", discount_Amt);
        console.log("Final Amount =", final_Amt);
